<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick'em Pot Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style id="css">
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#EAEDE8; --card:#FBFCFA; --card2:#F2F5F0;
  --ink:#14201C; --muted:#5F6C65; --faint:#8A968F;
  --rule:#D3DAD2; --rule2:#E2E7E0;
  --brand:#0E6B4F; --brand-soft:#DCEBE2; --brand-ink:#0A4F3A; --on-brand:#FFFFFF;
  --due:#A63F28; --due-soft:#F6E1DA;
  --pend:#8A6210; --pend-soft:#F5E9D2;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 8px 24px -16px rgba(20,32,28,.28);
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --card:#161F1A; --card2:#1C2621;
    --ink:#E7EEE8; --muted:#9AA9A0; --faint:#75847B;
    --rule:#28342D; --rule2:#212B25;
    --brand:#4CC496; --brand-soft:#173328; --brand-ink:#7FD9B4; --on-brand:#08120E;
    --due:#F0876A; --due-soft:#3A2019;
    --pend:#DFB264; --pend-soft:#33270F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --card:#161F1A; --card2:#1C2621;
  --ink:#E7EEE8; --muted:#9AA9A0; --faint:#75847B;
  --rule:#28342D; --rule2:#212B25;
  --brand:#4CC496; --brand-soft:#173328; --brand-ink:#7FD9B4; --on-brand:#08120E;
  --due:#F0876A; --due-soft:#3A2019;
  --pend:#DFB264; --pend-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.9);
}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
}
h1,h2,h3{font-family:"Chivo","Public Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#root{max-width:760px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom))}

.mast{padding:20px 2px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mast .eyebrow{font-family:"Chivo";font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.mast h1{font-size:24px;font-weight:800;line-height:1.1}
.savechip{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.04em;color:var(--faint);white-space:nowrap;padding-bottom:3px;text-align:right}
.savechip.on{color:var(--brand)}
.savechip.warn{color:var(--pend)}

.tabs{position:sticky;top:0;z-index:20;background:var(--paper);padding:6px 0 10px;display:flex;gap:4px}
.tabs::after{content:"";position:absolute;left:-14px;right:-14px;bottom:0;height:1px;background:var(--rule)}
.tab{flex:1;appearance:none;background:transparent;border:0;padding:9px 3px;border-radius:9px;
  font-family:"Chivo";font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab .cnt{font-family:"IBM Plex Mono";font-size:11px;opacity:.75;margin-left:3px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule2)}
.card-hd h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pad{padding:14px}

.row{display:flex;align-items:center;gap:9px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--rule2);position:relative}
.row:last-child{border-bottom:0}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.row.is-due::before{background:var(--due)}
.row.is-paid::before{background:var(--brand)}
.row.is-miss::before{background:var(--pend)}
.row.is-out{opacity:.55}
.row.is-out::before{background:var(--rule)}
.rname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{display:block;font-size:11.5px;font-weight:400;color:var(--faint);letter-spacing:.01em;white-space:normal}

.chip{font-family:"IBM Plex Mono";font-size:11px;font-weight:500;letter-spacing:.02em;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chip.paid{background:var(--brand-soft);color:var(--brand-ink)}
.chip.due{background:var(--due-soft);color:var(--due)}
.chip.pend{background:var(--pend-soft);color:var(--pend)}
.chip.flat{background:var(--card2);color:var(--muted)}
.stamp{display:inline-block;font-family:"Chivo";font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:1.5px solid var(--brand);color:var(--brand);border-radius:4px;padding:2px 5px;transform:rotate(-3deg)}
.stamp.miss{border-color:var(--pend);color:var(--pend);border-style:dashed}

.btn{appearance:none;border:1px solid var(--rule);background:var(--card2);color:var(--ink);border-radius:9px;
  padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.icon{padding:5px 0;width:30px;text-align:center;font-family:"IBM Plex Mono";font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--due);border-color:var(--due-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.weekbar{display:flex;align-items:center;gap:8px;margin-top:14px}
.weekbar .wk{flex:1;text-align:center}
.weekbar .wk .lab{font-family:"Chivo";font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.weekbar .wk .val{font-family:"Chivo";font-size:19px;font-weight:800;line-height:1.1}
.stepper{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-size:16px;line-height:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule2)}
.stat{background:var(--card);padding:12px 10px}
.stat .k{font-family:"Chivo";font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:"IBM Plex Mono";font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v.due{color:var(--due)} .stat .v.brand{color:var(--brand)} .stat .v.pend{color:var(--pend)}

.lockstrip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--rule2);font-size:13px}
.lockstrip.on{background:var(--card2)}
.lockstrip strong{font-weight:700;margin-left:4px}
.lockstrip .rsub{margin-top:3px;line-height:1.4}

.field{display:block;margin-bottom:12px}
.field .lab{display:block;font-family:"Chivo";font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--card2);border:1px solid var(--rule);border-radius:9px;padding:9px 10px;font-size:16px}
textarea{min-height:130px;resize:vertical;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 0 auto;padding:8px 10px;border-radius:9px;border:1px solid var(--rule);background:var(--card2);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

.search{margin-top:12px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--ink)}
.note{font-size:12.5px;color:var(--faint);padding:10px 14px;border-top:1px solid var(--rule2);line-height:1.5}

.scrim{position:fixed;inset:0;background:rgba(10,18,15,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;border:1px solid var(--rule);border-bottom:0;
  max-height:92vh;overflow:auto;box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.scrim{align-items:center;padding:20px}.sheet{border-radius:16px;border-bottom:1px solid var(--rule)}}
.sheet-hd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--rule2);z-index:2}
.sheet-hd h2{font-size:16px;font-weight:800}
.hist{font-size:13px;border-top:1px solid var(--rule2);padding:8px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner{background:var(--pend-soft);color:var(--pend);border:1px solid var(--rule);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:12px}
.banner.bad{background:var(--due-soft);color:var(--due)}
.banner strong{display:block;font-weight:700;margin-bottom:2px}
.banner button{float:right;margin-left:10px;background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
</style>
<meta name="theme-color" content="#EAEDE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<meta name="description" content="Weekly ledger for a pick'em pool: dues, prepay credit, kickoff lock, and who still owes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pot Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div id="root"></div>
<script id="state" type="application/json">
{"v":2,"league":"Family Pick'em","season":2026,"weekPrice":500,"totalWeeks":18,"currentWeek":1,"people":[],"weekData":{},"payments":[],"seq":1}
</script>
<script id="app">
(function(){
  "use strict";
  var STORE="pickem-pot-ledger-v2";
  var METHODS=[["Venmo","#3D95CE"],["Zelle","#6D1ED4"],["Cash App","#00C244"],["PayPal","#0070BA"],["Apple Cash","#8E8E93"],["Cash","#4F8A5B"],["Other","#8A968F"]];
  var root=document.getElementById("root");
  var state=JSON.parse(document.getElementById("state").textContent);
  var api=null, canWrite=true, mode="local", saveState="idle", timer=null, dirty=false, everTouched=false;

  try{var raw=localStorage.getItem(STORE); if(raw){var got=JSON.parse(raw); if(got&&got.people)state=got;}}catch(e){}

  var ui={tab:"week",week:state.currentWeek,q:"",modal:null,err:null,confirm:null};
  try{var s=sessionStorage.getItem("ppl-ui"); if(s){var o=JSON.parse(s); ui.tab=o.tab||ui.tab; ui.week=o.week||ui.week;}}catch(e){}
  function saveUi(){try{sessionStorage.setItem("ppl-ui",JSON.stringify({tab:ui.tab,week:ui.week}));}catch(e){}}

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function money(c){var n=Math.abs(c)/100,str=(n%1===0)?String(n):n.toFixed(2);return (c<0?"-$":"$")+str;}
  function uid(){return "id"+(state.seq++)+Math.random().toString(36).slice(2,6);}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fmtDate(iso){var p=String(iso||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):iso||"";}
  function wd(w){var k=String(w);
    if(!state.weekData[k])state.weekData[k]={out:[],locked:false,playing:null,missed:[],pot:null,winner:null,payout:"unpaid"};
    var d=state.weekData[k];
    if(!d.out)d.out=[]; if(!d.missed)d.missed=[]; if(d.locked==null)d.locked=false;
    return d;}
  function isLocked(w){var d=state.weekData[String(w)];return !!(d&&d.locked);}
  function satOut(w,pid){var d=state.weekData[String(w)];return !!(d&&d.out&&d.out.indexOf(pid)>-1);}
  function person(id){for(var i=0;i<state.people.length;i++)if(state.people[i].id===id)return state.people[i];return null;}
  function pname(id){var p=person(id);return p?p.name:"(removed)";}
  function methodColor(m){for(var i=0;i<METHODS.length;i++)if(METHODS[i][0]===m)return METHODS[i][1];return "#8A968F";}

  /* ---------- ledger ----------
     Rule: dues are paid BEFORE Thursday kickoff. When a week locks, anyone
     not paid up is out for that week — never charged, never in the pot,
     and there is no back paying. Credit on account rolls to the next week. */
  function compute(){
    var by={},price=state.weekPrice;
    state.people.forEach(function(p){
      var credits=0;
      state.payments.forEach(function(x){if(x.pid===p.id)credits+=x.cents;});
      for(var w=1;w<=state.currentWeek;w++){var d=state.weekData[String(w)];
        if(d&&d.locked&&d.winner===p.id&&d.payout==="credit")credits+=(d.pot||0);}
      var rem=credits,status={},played=[],missed=[],sat=[];
      for(var w2=1;w2<=state.currentWeek;w2++){
        var d2=state.weekData[String(w2)]||{};
        if(satOut(w2,p.id)){status[w2]="sat";sat.push(w2);continue;}
        if(d2.locked){
          /* A locked week is history: bill it at the price it locked at, not
             at whatever the buy-in happens to be today. */
          if(d2.playing&&d2.playing.indexOf(p.id)>-1){rem-=(d2.price!=null?d2.price:price);status[w2]="played";played.push(w2);}
          else{status[w2]="missed";missed.push(w2);}
        }else{
          if(rem>=price){rem-=price;status[w2]="in";played.push(w2);}
          else status[w2]="unpaid";
        }
      }
      var cur=state.currentWeek;
      var need=(!isLocked(cur)&&status[cur]==="unpaid")?Math.max(0,price-rem):0;
      by[p.id]={status:status,played:played,missed:missed,sat:sat,credit:rem,credits:credits,
        spent:credits-rem,need:need,inNow:status[cur]==="in"||status[cur]==="played"};
    });
    return by;
  }
  var _by=null;
  function ledger(){if(!_by)_by=compute();return _by;}
  function invalidate(){_by=null;}

  function potOf(w){
    var d=state.weekData[String(w)];
    if(d&&d.locked)return d.pot!=null?d.pot:(d.playing||[]).length*state.weekPrice;
    var by=ledger(),n=0;
    state.people.forEach(function(p){if(by[p.id].status[w]==="in")n++;});
    return n*state.weekPrice;
  }
  function coveredFor(w){
    var by=ledger(),a=[];
    state.people.forEach(function(p){var s=by[p.id].status[w];if(s==="in"||s==="played")a.push(p.id);});
    return a;
  }
  function lockWeek(w){
    var d=wd(w); if(d.locked||w>state.currentWeek)return;
    invalidate();
    var by=ledger(),playing=[],missed=[];
    state.people.forEach(function(p){
      if(satOut(w,p.id))return;
      if(by[p.id].status[w]==="in")playing.push(p.id); else missed.push(p.id);
    });
    d.price=state.weekPrice;
    d.playing=playing; d.missed=missed; d.pot=playing.length*d.price; d.locked=true;
    d.everLocked=true;
    invalidate();
  }
  /* Who would join this week if it were locked again now, after having been
     unlocked? They missed the deadline once, so re-locking quietly readmits
     them — name them on the button instead. */
  function readmitted(w){
    var d=state.weekData[String(w)]; if(!d||!d.everLocked||d.locked||!d.prevMissed)return [];
    var by=ledger(),out=[];
    d.prevMissed.forEach(function(id){
      if(satOut(w,id))return;
      if(by[id]&&by[id].status[w]==="in")out.push(pname(id));
    });
    return out;
  }
  function totals(){
    var t={in:0,paidOut:0,credit:0,owedOut:0,need:0,unpaidCount:0},by=ledger();
    state.payments.forEach(function(x){t.in+=x.cents;});
    state.people.forEach(function(p){t.credit+=by[p.id].credit;if(by[p.id].need>0){t.need+=by[p.id].need;t.unpaidCount++;}});
    for(var w=1;w<=state.currentWeek;w++){var d=state.weekData[String(w)];
      if(d&&d.locked&&d.winner){if(d.payout==="paid")t.paidOut+=(d.pot||0);else if(d.payout==="unpaid")t.owedOut+=(d.pot||0);}}
    t.hand=t.in-t.paidOut;
    return t;
  }

  /* ---------- saving ---------- */
  function buildDoc(){
    var css=document.getElementById("css").textContent;
    var app=document.getElementById("app").textContent;
    var json=JSON.stringify(state).replace(/</g,"\\u003c");
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
      +'<meta name="viewport" content="width=device-width, initial-scale=1">'
      +'<title>Pick\'em Pot Ledger</title>'
      +'<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">'
      +'<style id="css">'+css+'<\/style></head><body><div id="root"></div>'
      +'<script id="state" type="application/json">'+json+'<\/script>'
      +'<script id="app">'+app+'<\/script></body></html>';
  }
  function saveLocal(){
    try{localStorage.setItem(STORE,JSON.stringify(state));dirty=false;saveState="saved";}
    catch(e){saveState="error";}
  }
  function touch(){
    dirty=true; everTouched=true; invalidate();
    if(mode==="local"){saveLocal();return;}
    if(!api||!canWrite){saveState="readonly";return;}
    saveState="pending";
    clearTimeout(timer); timer=setTimeout(flush,1400);
  }
  function flush(){
    if(!api||!canWrite||!dirty)return;
    if(ui.modal){clearTimeout(timer);timer=setTimeout(flush,1600);return;}
    saveState="saving";paint();saveUi();
    api.publish(buildDoc()).then(function(){dirty=false;saveState="saved";paint();})
      .catch(function(err){
        var code=(err&&err.code)||"upstream_error";
        if(code==="conflict"){saveState="conflict";paint();return;}
        if(code==="rate_limited"){saveState="pending";clearTimeout(timer);timer=setTimeout(flush,6000);paint();return;}
        if(code==="upstream_error"){saveState="error";paint();return;}
        canWrite=false;saveState="readonly";paint();
      });
  }
  function saveLabel(){
    if(mode==="local")return saveState==="error"?["Storage full — export a backup","warn"]:["Saved on this device","on"];
    if(saveState==="saving")return["Saving…",""];
    if(saveState==="pending")return["Unsaved…",""];
    if(saveState==="saved")return["Saved for everyone","on"];
    if(saveState==="conflict")return["Someone else saved first","warn"];
    if(saveState==="readonly")return["View only","warn"];
    if(saveState==="error")return["Save failed","warn"];
    return ["",""];
  }

  /* ---------- views ---------- */
  function mast(){
    var l=saveLabel();
    return '<div class="mast"><div><div class="eyebrow">'+esc(state.season)+' NFL · against the spread</div>'
      +'<h1>'+esc(state.league)+'</h1></div>'
      +'<div class="savechip '+l[1]+'">'+esc(l[0])+'</div></div>';
  }
  function tabs(){
    var t=totals();
    var defs=[["week","Week",""],["people","People",state.people.length?String(state.people.length):""],
      ["money","Money",""],["kickoff","Kickoff",t.unpaidCount?String(t.unpaidCount):""]];
    return '<div class="tabs">'+defs.map(function(d){
      return '<button class="tab" role="tab" aria-selected="'+(ui.tab===d[0])+'" data-act="tab" data-v="'+d[0]+'">'+d[1]+(d[2]?'<span class="cnt">'+d[2]+'</span>':'')+'</button>';
    }).join("")+'</div>';
  }

  function weekView(){
    var by=ledger(),w=ui.week,d=wd(w),lk=isLocked(w),open=w<=state.currentWeek;
    var h='<div class="weekbar">'
      +'<button class="stepper" data-act="week" data-v="-1" '+(w<=1?"disabled":"")+'>‹</button>'
      +'<div class="wk"><div class="lab">Week</div><div class="val">'+w+' <span style="color:var(--faint);font-weight:600">of '+state.totalWeeks+'</span></div></div>'
      +'<button class="stepper" data-act="week" data-v="1" '+(w>=state.totalWeeks?"disabled":"")+'>›</button></div>';

    if(!state.people.length){
      return h+'<div class="card"><div class="empty"><h3>No one in the pool yet</h3>'
        +'<p>Paste the roster and the ledger takes it from there.</p>'
        +'<button class="btn pri" data-act="roster">Add players</button></div></div>';
    }
    if(!open){
      return h+'<div class="card"><div class="empty"><h3>Week '+w+' hasn’t opened</h3>'
        +'<p>Open it when the week’s picks go up.</p>'
        +'<button class="btn pri" data-act="openweek" data-v="'+w+'">Open week '+w+'</button></div></div>';
    }

    var inN=0,unpaidN=0,missN=0,satN=0;
    state.people.forEach(function(p){var s=by[p.id].status[w];
      if(s==="in"||s==="played")inN++; else if(s==="unpaid")unpaidN++; else if(s==="missed")missN++; else satN++;});

    h+='<div class="card"><div class="stats">'
      +'<div class="stat"><div class="k">'+(lk?"Pot":"Pot so far")+'</div><div class="v brand">'+money(potOf(w))+'</div></div>'
      +'<div class="stat"><div class="k">'+(lk?"Playing":"Paid in")+'</div><div class="v">'+inN+'</div></div>'
      +(lk?'<div class="stat"><div class="k">Missed</div><div class="v '+(missN?"pend":"")+'">'+missN+'</div></div>'
         :'<div class="stat"><div class="k">Not in yet</div><div class="v '+(unpaidN?"due":"")+'">'+unpaidN+'</div></div>')
      +'</div>';

    var readd=lk?[]:readmitted(w);
    var missNames=lk?(d.missed||[]).map(pname):[];
    h+='<div class="lockstrip'+(lk?' on':'')+'">'
      +'<div><span class="chip '+(lk?'pend':'flat')+'">'+(lk?'Locked':'Open')+'</span><strong>'+(lk?'Kickoff has passed':'Pay before Thursday kickoff')+'</strong>'
      +'<span class="rsub">'+(lk
        ? (missNames.length? missNames.length+' didn’t pay in time and sat out: '+esc(missNames.join(", ")) : 'Everyone who was in had paid up.')
        : 'Lock at kickoff. Anyone not paid up right then is out for week '+w+' — no back paying.')+'</span></div>'
      +(lk?'<button class="btn sm ghost" data-act="unlock" data-v="'+w+'">'+(ui.confirm==="unlock:"+w?"Tap again":"Unlock")+'</button>'
          :'<button class="btn sm '+(unpaidN?'':'pri')+'" data-act="lock" data-v="'+w+'">'
            +(ui.confirm==="lock:"+w
               ? (readd.length?("Tap again — lets in "+readd.join(", ")):("Tap again — drops "+unpaidN))
               : (d.everLocked?"Re-lock week "+w:"Lock week "+w))+'</button>')
      +'</div>';
    if(!lk&&readd.length){
      h+='<div class="note">Week '+w+' was locked before. Locking it again puts '+esc(readd.join(", "))
        +' back in, after paying late — the league rule is that they sat this week out. '
        +'The pot would go from '+money(d.prevPot||0)+' to '+money(potOf(w))+'.</div>';
    }

    if(lk){
      var elig=(d.playing||[]);
      var opts='<option value="">— pick winner —</option>'+elig.map(function(id){
        return '<option value="'+id+'"'+(d.winner===id?" selected":"")+'>'+esc(pname(id))+'</option>';}).join("");
      h+='<div class="pad" style="border-top:1px solid var(--rule2)">'
        +'<label class="field"><span class="lab">Week '+w+' winner</span><select data-act="winner">'+opts+'</select></label>'
        +(d.winner?'<div class="seg"><button data-act="payout" data-v="unpaid" aria-pressed="'+(d.payout==="unpaid")+'">Owed '+money(d.pot||0)+'</button>'
          +'<button data-act="payout" data-v="paid" aria-pressed="'+(d.payout==="paid")+'">Paid out</button>'
          +'<button data-act="payout" data-v="credit" aria-pressed="'+(d.payout==="credit")+'">Left in as credit</button></div>':'')
        +'</div>';
    }
    h+='</div>';

    h+='<div class="search"><input type="text" placeholder="Find a name…" data-act="q" value="'+esc(ui.q)+'"></div>';
    h+='<div class="card"><div class="card-hd"><h2>Week '+w+' · '+money(state.weekPrice)+' each</h2>'
      +'<button class="btn sm" data-act="pay" data-v="">Log payment</button></div>';
    var list=state.people.filter(match).sort(byName);
    h+=list.map(function(p){
      var b=by[p.id],s=b.status[w],cls,chip;
      if(s==="in"||s==="played"){cls="is-paid";chip='<span class="stamp">'+(lk?"Playing":"Paid")+'</span>';}
      else if(s==="unpaid"){cls="is-due";chip='<span class="chip due">Needs '+money(b.need||state.weekPrice)+'</span>';}
      else if(s==="missed"){cls="is-miss";chip='<span class="stamp miss">Missed</span>';}
      else{cls="is-out";chip='<span class="chip flat">Sat out</span>';}
      var sub=b.credit>0?"Credit "+money(b.credit)+" on account":(b.missed.length?b.missed.length+" week"+(b.missed.length>1?"s":"")+" missed":"No credit left");
      return '<div class="row '+cls+'"><div class="rname">'+esc(p.name)+'<span class="rsub">'+sub+'</span></div>'
        +chip
        +'<button class="btn icon sm" title="Log payment" data-act="pay" data-v="'+p.id+'">+</button>'
        +(lk?'':'<button class="btn icon sm ghost" title="'+(s==="sat"?"Bring back in":"Mark sitting out")+'" data-act="inout" data-v="'+p.id+'">'+(s==="sat"?"↺":"−")+'</button>')+'</div>';
    }).join("")||'<div class="empty">No names match “'+esc(ui.q)+'”</div>';
    h+='</div>';

    if(w===state.currentWeek&&w<state.totalWeeks){
      h+='<div class="card"><div class="pad btnrow"><button class="btn '+(lk?'pri':'')+'" data-act="openweek" data-v="'+(w+1)+'">Open week '+(w+1)+'</button></div>'
        +'<div class="note">Opening week '+(w+1)+' locks week '+w+' first if it isn’t locked. Anyone holding credit is entered automatically.</div></div>';
    }
    return h;
  }

  function kickoffView(){
    var by=ledger(),t=totals(),cur=state.currentWeek,lk=isLocked(cur);
    var short=state.people.filter(function(p){return by[p.id].need>0;}).sort(byName);
    var h='<div class="card"><div class="stats">'
      +'<div class="stat"><div class="k">Week</div><div class="v">'+cur+'</div></div>'
      +'<div class="stat"><div class="k">Not in yet</div><div class="v '+(short.length?"due":"")+'">'+short.length+'</div></div>'
      +'<div class="stat"><div class="k">Prepaid held</div><div class="v brand">'+money(t.credit)+'</div></div>'
      +'</div><div class="note">'+(lk
        ? 'Week '+cur+' is locked — nobody else can buy in. Open week '+(cur+1)+' from the Week tab.'
        : 'These names are out of week '+cur+' unless they pay before Thursday kickoff.')+'</div></div>';

    if(!lk){
      h+='<div class="card"><div class="card-hd"><h2>Not in for week '+cur+'</h2></div>';
      h+=short.map(function(p){
        var b=by[p.id];
        return '<div class="row is-due"><div class="rname">'+esc(p.name)
          +'<span class="rsub">'+(b.credit>0?"has "+money(b.credit)+" credit":"no credit")+(b.missed.length?" · missed "+b.missed.length:"")+'</span></div>'
          +'<span class="chip due">'+money(b.need)+'</span>'
          +'<button class="btn icon sm" data-act="pay" data-v="'+p.id+'">+</button></div>';
      }).join("")||'<div class="empty"><h3>Everyone’s in</h3><p>The whole pool is paid up for week '+cur+'.</p></div>';
      h+='</div>';
      if(short.length){
        var txt="Week "+cur+" pick'em — "+money(state.weekPrice)+" before Thursday kickoff or you're out this week:\n"
          +short.map(function(p){return "• "+p.name+" — "+money(by[p.id].need);}).join("\n");
        h+='<div class="card"><div class="card-hd"><h2>Chat reminder</h2><button class="btn sm" data-act="copy">Copy</button></div>'
          +'<div class="pad"><textarea id="copytext" readonly>'+esc(txt)+'</textarea></div></div>';
      }
    }

    var missers=state.people.filter(function(p){return by[p.id].missed.length>0;})
      .sort(function(a,b2){return by[b2.id].missed.length-by[a.id].missed.length;});
    if(missers.length){
      h+='<div class="card"><div class="card-hd"><h2>Missed weeks</h2></div>';
      h+=missers.map(function(p){var b=by[p.id];
        return '<div class="row is-miss"><div class="rname">'+esc(p.name)+'<span class="rsub">wk '+b.missed.join(", ")+'</span></div>'
          +'<span class="chip pend">'+b.missed.length+'×</span></div>';}).join("");
      h+='<div class="note">Weren’t paid up at kickoff, so they sat those weeks out. Nothing is owed for them.</div></div>';
    }
    var pend=[];
    for(var w=1;w<=cur;w++){var d=state.weekData[String(w)];
      if(d&&d.locked&&d.winner&&d.payout==="unpaid")
        pend.push('<div class="row is-due"><div class="rname">Week '+w+' — '+esc(pname(d.winner))+'<span class="rsub">winnings not paid out</span></div><span class="chip due">'+money(d.pot||0)+'</span></div>');}
    if(pend.length)h+='<div class="card"><div class="card-hd"><h2>Payouts pending</h2></div>'+pend.join("")+'</div>';
    return h;
  }

  function peopleView(){
    var by=ledger(),cur=state.currentWeek;
    var h='<div class="search"><input type="text" placeholder="Find a name…" data-act="q" value="'+esc(ui.q)+'"></div>';
    h+='<div class="card"><div class="card-hd"><h2>'+state.people.length+' in the pool</h2>'
      +'<button class="btn sm" data-act="roster">Add players</button></div>';
    var list=state.people.filter(match).sort(function(a,b2){
      var d=by[b2.id].need-by[a.id].need; if(d)return d; return byName(a,b2);});
    h+=list.map(function(p){
      var b=by[p.id],cls=b.need>0?"is-due":(b.credit>0?"is-paid":"");
      var chip=b.need>0?'<span class="chip due">Needs '+money(b.need)+'</span>'
        :(b.credit>0?'<span class="chip paid">Credit '+money(b.credit)+'</span>':'<span class="chip flat">'+(b.status[cur]==="sat"?"Sitting out":"In")+'</span>');
      return '<div class="row '+cls+'" data-act="who" data-v="'+p.id+'" style="cursor:pointer"><div class="rname">'+esc(p.name)
        +'<span class="rsub">'+b.played.length+' wk played · '+money(b.credits)+' in'+(b.missed.length?' · '+b.missed.length+' missed':'')+'</span></div>'
        +chip+'<span style="color:var(--faint)">›</span></div>';
    }).join("")||'<div class="empty">No players yet.</div>';
    h+='</div>';
    return h;
  }

  function moneyView(){
    var t=totals();
    var h='<div class="card"><div class="stats">'
      +'<div class="stat"><div class="k">Collected</div><div class="v brand">'+money(t.in)+'</div></div>'
      +'<div class="stat"><div class="k">Paid out</div><div class="v">'+money(t.paidOut)+'</div></div>'
      +'<div class="stat"><div class="k">In hand</div><div class="v">'+money(t.hand)+'</div></div>'
      +'</div><div class="note">Of the '+money(t.hand)+' in hand: '+money(t.credit)+' prepay covering future weeks, '
      +money(t.owedOut)+' winnings not paid out, '+money(Math.max(0,t.hand-t.credit-t.owedOut))+' this week’s pot in play.</div></div>';

    var byM={};
    state.payments.forEach(function(x){byM[x.method]=(byM[x.method]||0)+x.cents;});
    var keys=Object.keys(byM).sort(function(a,b){return byM[b]-byM[a];});
    if(keys.length){
      h+='<div class="card"><div class="card-hd"><h2>By source</h2></div>';
      h+=keys.map(function(m){return '<div class="row"><div class="rname"><span class="dot" style="background:'+methodColor(m)+'"></span>'+esc(m)+'</div><span class="num">'+money(byM[m])+'</span></div>';}).join("");
      h+='</div>';
    }
    h+='<div class="card"><div class="card-hd"><h2>Ledger · '+state.payments.length+' entries</h2>'
      +'<button class="btn sm pri" data-act="pay" data-v="">Log payment</button></div>';
    var ps=state.payments.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    h+=ps.map(function(x){
      return '<div class="row"><div class="rname">'+esc(pname(x.pid))
        +'<span class="rsub"><span class="dot" style="background:'+methodColor(x.method)+'"></span>'+esc(x.method)+' · '+fmtDate(x.date)+(x.note?" · "+esc(x.note):"")+'</span></div>'
        +'<span class="num" style="font-weight:600">'+money(x.cents)+'</span>'
        +'<button class="btn icon sm ghost danger" title="Delete" data-act="delpay" data-v="'+x.id+'">'+(ui.confirm==="delpay:"+x.id?"!":"×")+'</button></div>';
    }).join("")||'<div class="empty">No payments logged yet.</div>';
    h+='</div>';
    return h;
  }

  function setupCard(){
    return '<div class="card"><div class="card-hd"><h2>League setup</h2>'
      +'<button class="btn sm ghost" data-act="settings">Edit</button></div>'
      +'<div class="note">'+esc(state.league)+' · '+money(state.weekPrice)+'/week · '+state.totalWeeks+' weeks · on week '+state.currentWeek+'.</div>'
      +(mode==="local"?'<div class="pad btnrow" style="border-top:1px solid var(--rule2)">'
        +'<button class="btn sm" data-act="export">Export backup</button>'
        +'<button class="btn sm" data-act="import">Restore backup</button></div>'
        +'<div class="note">The ledger lives in this browser. Export a backup now and then — clearing site data wipes it.</div>':'')
      +'</div>';
  }

  function match(p){return !ui.q||p.name.toLowerCase().indexOf(ui.q.toLowerCase())>-1;}
  function byName(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;}

  /* ---------- modals ---------- */
  function modalHtml(){
    if(!ui.modal)return "";
    var m=ui.modal,body="",title="";
    if(m.type==="pay"){
      title="Log a payment";
      var opts=state.people.slice().sort(byName).map(function(p){return '<option value="'+p.id+'"'+(m.pid===p.id?" selected":"")+'>'+esc(p.name)+'</option>';}).join("");
      body='<label class="field"><span class="lab">Who paid</span><select id="m-pid">'+(m.pid?"":'<option value="">— pick —</option>')+opts+'</select></label>'
        +'<label class="field"><span class="lab">Amount</span><input type="number" id="m-amt" step="0.01" min="0" inputmode="decimal" value="'+esc(m.amt!=null&&m.amt!==""?m.amt:(state.weekPrice/100))+'"></label>'
        +'<div class="field"><span class="lab">Quick</span><div class="seg">'
          +[5,10,20,25,50,85].map(function(v){return '<button type="button" data-act="quick" data-v="'+v+'">$'+v+'</button>';}).join("")+'</div></div>'
        +'<div class="field"><span class="lab">Source</span><div class="seg" id="m-method">'
          +METHODS.map(function(x){return '<button type="button" data-act="method" data-v="'+x[0]+'" aria-pressed="'+((m.method||"Venmo")===x[0])+'"><span class="dot" style="background:'+x[1]+'"></span>'+x[0]+'</button>';}).join("")+'</div></div>'
        +'<label class="field"><span class="lab">Date</span><input type="date" id="m-date" value="'+(m.date||today())+'"></label>'
        +'<label class="field"><span class="lab">Note (optional)</span><input type="text" id="m-note" placeholder="e.g. covered Dad too" value="'+esc(m.note||"")+'"></label>'
        +'<div class="btnrow"><button class="btn pri" data-act="savepay">Save payment</button><button class="btn ghost" data-act="close">Cancel</button></div>';
    } else if(m.type==="roster"){
      title="Add players";
      body='<label class="field"><span class="lab">One name per line</span><textarea id="m-roster" placeholder="Zach&#10;Mike&#10;Dad&#10;…"></textarea></label>'
        +'<div class="btnrow"><button class="btn pri" data-act="saveroster">Add to pool</button><button class="btn ghost" data-act="close">Cancel</button></div>';
    } else if(m.type==="who"){
      var p=person(m.pid); if(!p){ui.modal=null;return "";}
      var b=ledger()[p.id];
      title=p.name;
      var hist=state.payments.filter(function(x){return x.pid===p.id;}).sort(function(a,b2){return a.date<b2.date?1:-1;})
        .map(function(x){return '<div class="hist"><span><span class="dot" style="background:'+methodColor(x.method)+'"></span>'+esc(x.method)+' · '+fmtDate(x.date)+'</span><span class="num">'+money(x.cents)+'</span></div>';}).join("")
        ||'<div class="hist" style="color:var(--faint)">No payments yet</div>';
      var chips="";
      for(var w=1;w<=state.currentWeek;w++){
        var s=b.status[w],c=(s==="played"||s==="in")?"paid":(s==="missed"?"pend":(s==="unpaid"?"due":"flat"));
        chips+='<span class="chip '+c+'" style="margin:0 4px 4px 0;display:inline-block">wk '+w+'</span>';
      }
      body='<div class="stats" style="margin:-14px -14px 14px">'
        +'<div class="stat"><div class="k">Paid in</div><div class="v">'+money(b.credits)+'</div></div>'
        +'<div class="stat"><div class="k">Weeks played</div><div class="v">'+b.played.length+'</div></div>'
        +'<div class="stat"><div class="k">Credit</div><div class="v brand">'+money(b.credit)+'</div></div></div>'
        +'<div class="field"><span class="lab">Weeks</span>'+(chips||'<span class="chip flat">season hasn’t started</span>')
        +(b.missed.length?'<div class="rsub" style="margin-top:6px">Missed the deadline in wk '+b.missed.join(", ")+'</div>':'')+'</div>'
        +'<div class="field"><span class="lab">Payments</span>'+hist+'</div>'
        +'<label class="field"><span class="lab">Name</span><input type="text" id="m-name" value="'+esc(p.name)+'"></label>'
        +'<div class="btnrow"><button class="btn pri" data-act="pay" data-v="'+p.id+'">Log payment</button>'
        +'<button class="btn" data-act="rename" data-v="'+p.id+'">Save name</button>'
        +'<button class="btn danger" data-act="delperson" data-v="'+p.id+'">'
        +(ui.confirm==="delperson:"+p.id
           ?("Tap again — also deletes "+state.payments.filter(function(x){return x.pid===p.id;}).length+" payment(s)")
           :"Remove")+'</button></div>';
    } else if(m.type==="settings"){
      title="League setup";
      body='<label class="field"><span class="lab">League name</span><input type="text" id="m-league" value="'+esc(state.league)+'"></label>'
        +'<label class="field"><span class="lab">Season</span><input type="number" id="m-season" min="2020" max="2100" value="'+state.season+'"></label>'
        +'<label class="field"><span class="lab">Weekly buy-in ($)</span><input type="number" id="m-price" step="0.5" min="0" value="'+(state.weekPrice/100)+'"></label>'
        +'<label class="field"><span class="lab">Weeks in the season</span><input type="number" id="m-weeks" min="1" max="30" value="'+state.totalWeeks+'"></label>'
        +'<label class="field"><span class="lab">Current week</span><input type="number" id="m-cur" min="1" max="30" value="'+state.currentWeek+'"></label>'
        +'<div class="btnrow"><button class="btn pri" data-act="savesettings">Save</button><button class="btn ghost" data-act="close">Cancel</button></div>'
        +'<div class="btnrow" style="margin-top:18px;border-top:1px solid var(--rule2);padding-top:14px">'
        +'<button class="btn danger" data-act="newseason">'+(ui.confirm==="newseason:"?"Tap again — clears weeks & payments":"Start a new season")+'</button></div>'
        +'<div class="note" style="border:0;padding-left:0">Keeps the roster, clears every week and payment.</div>';
    }
    return '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'
      +'<div class="sheet-hd"><h2>'+esc(title)+'</h2><button class="btn sm ghost" data-act="close">Close</button></div>'
      +'<div class="pad">'+(ui.err?'<div class="banner" style="margin:0 0 12px">'+esc(ui.err)+'</div>':'')+body+'</div></div></div>';
  }

  function daysSince(iso){
    if(!iso)return null;
    var a=String(iso).split("-"),t=Date.parse(a[0]+"-"+a[1]+"-"+a[2]+"T00:00:00");
    if(isNaN(t))return null;
    return Math.floor((Date.now()-t)/86400000);
  }
  function installed(){
    try{return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;}
    catch(e){return false;}
  }
  function dismissed(k){try{return localStorage.getItem("ppl-x-"+k)==="1";}catch(e){return false;}}
  function alerts(){
    if(mode!=="local")return "";
    var out="";
    if(saveState==="error"){
      out+='<div class="banner bad"><strong>This device stopped saving.</strong>'
        +'Anything you enter now is only on screen — it is not being kept. '
        +'Export a backup from the Money tab before you close this.</div>';
    }
    if(state.payments.length&&!installed()&&!dismissed("install")){
      out+='<div class="banner"><button data-act="dismiss" data-v="install">Hide</button>'
        +'<strong>Add this to your Home Screen.</strong>'
        +'In a plain browser tab, iPhones can clear the ledger after about a week of not opening it. '
        +'Installed, it keeps the books. Share → Add to Home Screen.</div>';
    }
    if(state.payments.length){
      var d=daysSince(state.lastBackup);
      if(d===null)
        out+='<div class="banner"><strong>No backup yet.</strong>'
          +'The ledger only exists in this browser. Money tab → Export backup, then email it to yourself.</div>';
      else if(d>=14)
        out+='<div class="banner"><strong>Last backup was '+d+' days ago.</strong>'
          +'Money tab → Export backup.</div>';
    }
    return out;
  }
  function paint(){
    var view=ui.tab==="week"?weekView():ui.tab==="people"?peopleView():ui.tab==="money"?moneyView():kickoffView();
    var extra=(ui.tab==="people"||ui.tab==="money")?setupCard():"";
    root.innerHTML=mast()+alerts()+tabs()+view+extra
      +((mode==="artifact"&&!canWrite)?'<div class="banner">You’re viewing this ledger. Only the commissioner’s changes are saved.</div>':"")
      +modalHtml();
    var q=root.querySelector('input[data-act="q"]');
    if(q&&ui.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  }

  /* ---------- events ---------- */
  root.addEventListener("click",function(e){
    var el=e.target.closest("[data-act]"); if(!el)return;
    var a=el.getAttribute("data-act"),v=el.getAttribute("data-v");
    if(a==="scrim"&&e.target!==el)return;
    ui.focusQ=false;
    if(["delpay","delperson","unlock","lock","newseason","savesettings"].indexOf(a)<0)ui.confirm=null;
    if(["pay","roster","who","settings","close","scrim","tab"].indexOf(a)>-1)ui.err=null;
    switch(a){
      case "tab": ui.tab=v;ui.q="";saveUi();paint();break;
      case "week": ui.week=Math.min(state.totalWeeks,Math.max(1,ui.week+(+v)));saveUi();paint();break;
      case "openweek": {
        var tgt=+v;
        for(var k=1;k<tgt;k++)lockWeek(k);
        state.currentWeek=Math.max(state.currentWeek,tgt);ui.week=tgt;wd(tgt);saveUi();touch();paint();break;}
      case "lock": {
        if(ui.confirm!=="lock:"+v){ui.confirm="lock:"+v;paint();break;}
        ui.confirm=null;lockWeek(+v);touch();paint();break;}
      case "unlock": {
        if(ui.confirm!=="unlock:"+v){ui.confirm="unlock:"+v;paint();break;}
        ui.confirm=null;var du=wd(+v);
        du.prevMissed=(du.missed||[]).slice(); du.prevPot=du.pot;
        du.locked=false;du.playing=null;du.missed=[];du.pot=null;touch();paint();break;}
      case "inout": {var d=wd(ui.week);var i=d.out.indexOf(v);if(i>-1)d.out.splice(i,1);else d.out.push(v);touch();paint();break;}
      case "payout": wd(ui.week).payout=v;touch();paint();break;
      case "pay": ui.modal={type:"pay",pid:v||"",method:"Venmo"};paint();break;
      case "roster": ui.modal={type:"roster"};paint();break;
      case "who": ui.modal={type:"who",pid:v};paint();break;
      case "settings": ui.modal={type:"settings"};paint();break;
      case "close": case "scrim": ui.modal=null;paint();break;
      case "quick": {var amt=root.querySelector("#m-amt");if(amt)amt.value=v;break;}
      case "method": {
        ui.modal.method=v;
        var btns=root.querySelectorAll('#m-method [data-act="method"]');
        for(var j=0;j<btns.length;j++)btns[j].setAttribute("aria-pressed",String(btns[j].getAttribute("data-v")===v));
        break;}
      case "savepay": savePay();break;
      case "saveroster": saveRoster();break;
      case "savesettings": saveSettings();break;
      case "dismiss": {try{localStorage.setItem("ppl-x-"+v,"1");}catch(e){}paint();break;}
      case "export": doExport();break;
      case "import": doImport();break;
      case "newseason": {
        if(ui.confirm!=="newseason:"){ui.confirm="newseason:";paint();break;}
        ui.confirm=null;doExport();
        state.weekData={};state.payments=[];state.currentWeek=1;state.season=state.season+1;
        ui.week=1;ui.modal=null;touch();paint();break;}
      case "delpay": {
        if(ui.confirm!=="delpay:"+v){ui.confirm="delpay:"+v;paint();break;}
        ui.confirm=null;state.payments=state.payments.filter(function(x){return x.id!==v;});touch();paint();break;}
      case "delperson": {
        if(ui.confirm!=="delperson:"+v){ui.confirm="delperson:"+v;paint();break;}
        ui.confirm=null;
        state.people=state.people.filter(function(x){return x.id!==v;});
        state.payments=state.payments.filter(function(x){return x.pid!==v;});
        Object.keys(state.weekData).forEach(function(kk){var d2=state.weekData[kk];
          if(d2.out)d2.out=d2.out.filter(function(x){return x!==v;});
          if(d2.playing)d2.playing=d2.playing.filter(function(x){return x!==v;});
          if(d2.missed)d2.missed=d2.missed.filter(function(x){return x!==v;});
          if(d2.playing)d2.pot=d2.playing.length*(d2.price!=null?d2.price:state.weekPrice);
          if(d2.winner===v){d2.winner=null;d2.payout="unpaid";}});
        ui.modal=null;touch();paint();break;}
      case "rename": {
        var p2=person(v),fld=root.querySelector("#m-name");if(!p2||!fld)break;
        var nn=(fld.value||"").trim();
        if(!nn){ui.err="A name can’t be blank.";paint();break;}
        p2.name=nn;ui.err=null;touch();paint();break;}
      case "copy": {
        var ta=root.querySelector("#copytext");if(!ta)break;
        ta.select();
        if(navigator.clipboard&&navigator.clipboard.writeText)
          navigator.clipboard.writeText(ta.value).then(function(){el.textContent="Copied";},function(){el.textContent="Select & copy";});
        else{try{document.execCommand("copy");el.textContent="Copied";}catch(err){el.textContent="Select & copy";}}
        break;}
    }
  });
  root.addEventListener("input",function(e){
    var el=e.target;
    if(el.getAttribute&&el.getAttribute("data-act")==="q"){ui.q=el.value;ui.focusQ=true;paint();}
  });
  root.addEventListener("change",function(e){
    var el=e.target,a=el.getAttribute&&el.getAttribute("data-act");
    if(a==="winner"){var d=wd(ui.week);d.winner=el.value||null;if(!d.winner)d.payout="unpaid";touch();paint();}
  });
  window.addEventListener("beforeunload",function(){if(dirty&&mode==="artifact"){clearTimeout(timer);flush();}});

  function savePay(){
    var pid=root.querySelector("#m-pid"),amt=root.querySelector("#m-amt"),dt=root.querySelector("#m-date"),nt=root.querySelector("#m-note");
    ui.modal.pid=pid?pid.value:"";ui.modal.amt=amt?amt.value:"";ui.modal.date=dt?dt.value:"";ui.modal.note=nt?nt.value:"";
    if(!pid||!pid.value){ui.err="Pick who paid.";paint();return;}
    var cents=Math.round(parseFloat(amt.value||"0")*100);
    if(!(cents>0)){ui.err="Enter an amount greater than zero.";paint();return;}
    ui.err=null;
    state.payments.push({id:uid(),pid:pid.value,cents:cents,method:ui.modal.method||"Venmo",date:dt.value||today(),note:(nt.value||"").trim()});
    ui.modal=null;touch();paint();
  }
  function saveRoster(){
    var ta=root.querySelector("#m-roster");if(!ta)return;
    var names=ta.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
    var have={};state.people.forEach(function(p){have[p.name.toLowerCase()]=1;});
    names.forEach(function(n){if(!have[n.toLowerCase()]){have[n.toLowerCase()]=1;state.people.push({id:uid(),name:n});}});
    ui.modal=null;touch();paint();
  }
  function saveSettings(){
    var l=root.querySelector("#m-league"),se=root.querySelector("#m-season"),pr=root.querySelector("#m-price"),
        wk=root.querySelector("#m-weeks"),cu=root.querySelector("#m-cur");
    state.league=(l.value||"Pick'em").trim();
    var sy=parseInt(se.value,10); if(sy>2000)state.season=sy;
    var c=Math.round(parseFloat(pr.value||"5")*100); if(c>0)state.weekPrice=c;
    var tw=parseInt(wk.value,10); if(tw>0)state.totalWeeks=tw;
    var cw=parseInt(cu.value,10);
    if(cw>0){
      cw=Math.min(cw,state.totalWeeks);
      /* Moving the week forward charges everyone for every week skipped over,
         straight out of their credit. A typo here quietly drains the pool. */
      if(cw>state.currentWeek+1){
        var jump=cw-state.currentWeek;
        if(ui.confirm!=="jump:"+cw){
          ui.confirm="jump:"+cw;
          ui.err="That skips "+jump+" weeks and bills everyone "+money(jump*state.weekPrice)
            +" of their credit for weeks that were never run. Tap Save again if that's right.";
          paint();return;
        }
        ui.confirm=null;
      }
      state.currentWeek=cw;
    }
    ui.week=Math.min(ui.week,state.totalWeeks);
    ui.err=null;ui.modal=null;touch();paint();
  }
  function doExport(){
    try{
      var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="pickem-ledger-"+today()+".json";
      state.lastBackup=today();
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
    }catch(e){ui.err="Couldn’t build the backup file.";paint();}
  }
  function doImport(){
    var inp=document.createElement("input");
    inp.type="file";inp.accept="application/json,.json";
    inp.onchange=function(){
      var f=inp.files&&inp.files[0];if(!f)return;
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var got=JSON.parse(fr.result);
          if(!got||!got.people||!got.weekData)throw 0;
          if(state.payments.length||state.people.length)doExport();
          state=got;ui.week=state.currentWeek;ui.modal=null;ui.err=null;touch();paint();
        }catch(e){ui.modal={type:"settings"};ui.err="That file isn’t a ledger backup.";paint();}
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  paint();
  if(window.claude&&window.claude.use){
    window.claude.use("artifact").then(function(ns){
      if(ns){api=ns;mode="artifact";dirty=everTouched;saveState=dirty?"pending":"idle";paint();if(dirty)flush();}
    }).catch(function(){});
  }
})();
</script>
<script id="boot">
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
